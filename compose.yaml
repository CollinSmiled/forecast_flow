name: forecast-flow

services:
  api:
    image: forecast-flow-api:dev

    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile

    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://forecast_flow:${POSTGRES_PASSWORD:-forecast_flow_dev}@postgres:5432/forecast_flow?sslmode=disable&pool_max_conns=10"

    ports:
      - "${API_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 15s
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine3.23

    environment:
      POSTGRES_DB: forecast_flow
      POSTGRES_USER: forecast_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecast_flow_dev}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1

    profiles:
      - tools

    volumes:
      - ./database/migrations:/migrations:ro

    command:
      - -path=/migrations
      - -database=postgres://forecast_flow:${POSTGRES_PASSWORD:-forecast_flow_dev}@postgres:5432/forecast_flow?sslmode=disable
      - up

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
