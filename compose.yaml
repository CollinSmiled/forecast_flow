name: forecast-flow

services:
  api:
    image: forecast-flow-api:dev

    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile

    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://forecast_flow:${POSTGRES_PASSWORD:-forecast_flow_dev}@postgres:5432/forecast_flow?sslmode=disable&pool_max_conns=10"
      ALLOWED_COUNTRY_CODES: "${ALLOWED_COUNTRY_CODES:-ID,SG,MY,TH,VN,PH,JP,KR,CN}"

    ports:
      - "${API_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 15s
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine3.23

    environment:
      POSTGRES_DB: forecast_flow
      POSTGRES_USER: forecast_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecast_flow_dev}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1

    profiles:
      - tools

    volumes:
      - ./database/migrations:/migrations:ro

    command:
      - -path=/migrations
      - -database=postgres://forecast_flow:${POSTGRES_PASSWORD:-forecast_flow_dev}@postgres:5432/forecast_flow?sslmode=disable
      - up

    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    stop_grace_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1

    entrypoint:
      - /bin/sh
      - /scripts/init-topics.sh

    volumes:
      - ./infrastructure/kafka/init-topics.sh:/scripts/init-topics.sh:ro

    depends_on:
      kafka:
        condition: service_healthy

  hotpath:
    image: forecast-flow-hotpath:dev

    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
      args:
        APP_NAME: hotpath

    environment:
      DATABASE_URL: "postgres://forecast_flow:${POSTGRES_PASSWORD:-forecast_flow_dev}@postgres:5432/forecast_flow?sslmode=disable&pool_max_conns=10"
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-postgres-hot-path}"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ingester:
    image: forecast-flow-ingester:dev

    profiles:
      - tools

    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
      args:
        APP_NAME: ingester

    environment:
      DATABASE_URL: "postgres://forecast_flow:${POSTGRES_PASSWORD:-forecast_flow_dev}@postgres:5432/forecast_flow?sslmode=disable&pool_max_conns=10"
      KAFKA_BROKERS: "kafka:19092"
      LOCATION_ID: "${LOCATION_ID:-}"
      FORECAST_DAYS: "${FORECAST_DAYS:-10}"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_data:
