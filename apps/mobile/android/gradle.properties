org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
# The Pub cache is on C: while this workspace is on D:. Kotlin's incremental
# cache cannot relativize plugin source paths across Windows drives.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
