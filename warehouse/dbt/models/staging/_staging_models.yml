version: 2

models:
  - name: stg_locations
    description: One normalized row per location from the latest operational reference snapshot.
    columns:
      - name: location_id
        description: Stable identifier used by forecast events.
        data_tests:
          - not_null
          - unique
      - name: open_meteo_location_id
        data_tests:
          - not_null
          - unique
      - name: city
        data_tests:
          - not_null
      - name: country_code
        data_tests:
          - not_null
      - name: timezone
        data_tests:
          - not_null
      - name: synced_at
        data_tests:
          - not_null

  - name: stg_operational_forecast_events
    description: One deduplicated row per operational forecast event with its JSON sections exposed.
    columns:
      - name: event_id
        description: Stable identifier supplied by the producing service.
        data_tests:
          - not_null
          - unique
      - name: location_id
        data_tests:
          - not_null
      - name: retrieved_at
        data_tests:
          - not_null
      - name: forecast_timezone
        data_tests:
          - not_null

  - name: stg_model_run_events
    description: One deduplicated row per provider model run with its hourly JSON array exposed.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: location_id
        data_tests:
          - not_null
      - name: model_id
        data_tests:
          - not_null
      - name: forecast_run_at
        data_tests:
          - not_null

  - name: stg_verification_weather_events
    description: One deduplicated reanalysis event with its hourly reference weather JSON exposed.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: location_id
        data_tests:
          - not_null
      - name: reference_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['reanalysis']
      - name: period_start
        data_tests:
          - not_null
      - name: period_end
        data_tests:
          - not_null
      - name: retrieved_at
        data_tests:
          - not_null
      - name: verification_timezone
        data_tests:
          - not_null
