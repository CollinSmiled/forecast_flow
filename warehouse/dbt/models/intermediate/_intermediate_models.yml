version: 2

models:
  - name: int_operational_hourly_forecasts
    description: Operational event arrays expanded to one row per location, snapshot, and valid hour.
    columns:
      - name: event_id
        data_tests:
          - not_null
      - name: valid_at
        data_tests:
          - not_null

  - name: int_model_run_hourly_forecasts
    description: Model-run arrays expanded to one row per location, model run, and valid hour.
    columns:
      - name: event_id
        data_tests:
          - not_null
      - name: model_id
        data_tests:
          - not_null
      - name: valid_at
        data_tests:
          - not_null
      - name: lead_time_hours
        data_tests:
          - not_null
