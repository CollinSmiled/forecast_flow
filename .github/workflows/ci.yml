name: CI

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"

          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

      - name: Build API
        run: go build ./apps/api

  dbt:
    name: dbt checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: warehouse/dbt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/dbt/requirements.txt

      - name: Install dbt
        run: python -m pip install --requirement requirements.txt

      - name: Create CI profile
        run: cp profiles.example.yml profiles.yml

      - name: Validate dbt project
        run: dbt parse --no-partial-parse

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Dockerfiles
        run: |
          docker build --check -f infrastructure/docker/api.Dockerfile .
          docker build --check -f infrastructure/docker/worker.Dockerfile .
          docker build --check -f warehouse/dbt/Dockerfile .

      - name: Validate Compose
        run: docker compose --profile analytics --profile tools config --quiet

      - name: Build core Compose services
        run: docker compose build

      - name: Build analytics Compose services
        run: docker compose --profile analytics build coldpath location-sync

      - name: Start Compose services
        run: docker compose up --detach --wait

      - name: Check API response
        run: curl --fail --show-error http://127.0.0.1:8080/health/live

      - name: Print logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up Compose
        if: always()
        run: docker compose down
